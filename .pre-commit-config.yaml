# Pre-commit hooks for PrimeMover Orchestrator
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom YAML tags like !file
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict

  # Python formatting with Black.
  #
  # Local, running the repo's own black -- NOT the pinned psf/black mirror.
  # That mirror was pinned at 24.3.0 while the venv (and CI) run 26.5.1, and
  # black's formatting changes between majors: the hook reformatted four files
  # that `make check`'s black then wanted to change straight back. A hook that
  # fights the canonical formatter is a hook people disable.
  - repo: local
    hooks:
      - id: black
        name: black
        entry: venv/bin/black --line-length=100
        language: system
        types: [python]
        files: ^(orchestrator|experiment_designer|scripts)/


  # Python linting with Ruff -- local, same reason as black above.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: venv/bin/ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        files: ^(orchestrator|experiment_designer|scripts)/


  # Python type checking with mypy.
  #
  # A local hook running the repo's own mypy, deliberately NOT mirrors-mypy.
  # That runs a pinned mypy in an isolated env with a handful of stub packages
  # and without --ignore-missing-imports, so it reported 10 errors on a tree
  # where `make check` and CI both reported none. Two contradictory answers to
  # "does mypy pass" is worse than no hook: the one that blocks your commit is
  # the one you learn to bypass with --no-verify.
  #
  # This runs exactly what `make check` and CI run, so there is one answer.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: venv/bin/mypy orchestrator/ experiment_designer/ scripts/ --ignore-missing-imports
        language: system
        pass_filenames: false
        types: [python]
        files: ^(orchestrator|experiment_designer|scripts)/


  # Check for secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  # Full test suite, on push only.
  #
  # The hooks above run per-commit on changed files, which catches formatting,
  # lint and type errors. They do NOT run the tests -- doing that on every
  # commit would be too slow to live with. Pushing is the right moment: it is
  # the last point before CI, and it is where a red build starts costing other
  # people time.
  #
  # Installed by `make hooks`, which sets up both stages.
  - repo: local
    hooks:
      - id: pytest
        name: pytest (full suite)
        entry: venv/bin/pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [mypy]  # Skip mypy in CI (run separately in GitHub Actions)
  submodules: false
