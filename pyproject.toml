[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primemover-orchestrator"
version = "0.1.0"
description = "Unified monitoring, debugging, and experiment management for PrimeMover ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "UMatter Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "mcp>=1.0.0,<2.0.0",
    "boto3>=1.34.0",
    "requests>=2.28.0",
    "jsonschema>=4.0.0",
    # Local Lambda service dependencies
    "flask>=3.0.0",
    "lxml>=4.9.0",
    "pandas>=2.0.0",
    "openai>=1.0.0",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
orchestrator = "orchestrator.cli:cli"
pmspec = "experiment_designer.cli:main"

[project.urls]
Homepage = "https://github.com/umatter/primemover-orchestrator"
Repository = "https://github.com/umatter/primemover-orchestrator"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*", "experiment_designer*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.pep8-naming]
# create_file_tag_loader returns a class, so binding it to a PascalCase name is
# correct rather than a naming violation. Kept here instead of per-line noqa
# comments, which black relocates when it wraps the call.
extend-ignore-names = ["FileTagLoader"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true

# numpy ships stubs written with the 3.12+ `type` statement, which mypy cannot
# parse while checking against python_version 3.10. It fails inside numpy's own
# .pyi before reaching any of our code, so don't follow imports into it. Our
# code is still checked as 3.10, which is what the package targets.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["orchestrator/tests", "experiment_designer/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
