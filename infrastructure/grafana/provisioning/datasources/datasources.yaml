apiVersion: 1

# Container names, not compose service names. With the ex63 overlay applied
# (docker-compose.ex63.yml) Grafana also sits on ex63_internal, where the infra
# stack has its OWN `loki` and `prometheus` -- and Docker's DNS resolved the
# short names to those. Every panel then queried the wrong Loki and came back
# empty, with no error anywhere. The container names are unique on the host.

datasources:
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://pm-orchestrator-loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "traceId=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"
          urlDisplayLabel: "View Trace"
        - datasourceUid: tempo
          matcherRegex: "correlation_id=([^\\s,]+)"
          name: CorrelationID
          url: "$${__value.raw}"

  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://pm-orchestrator-prometheus:9090
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    access: proxy
    url: http://pm-orchestrator-tempo:3200
    uid: tempo
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
      tracesToMetrics:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki
