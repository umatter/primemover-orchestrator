# PrimeMover log rotation
#
# Install on the VM with:
#   sudo cp infrastructure/logrotate/primemover.conf /etc/logrotate.d/primemover
#   sudo chown root:root /etc/logrotate.d/primemover && sudo chmod 644 /etc/logrotate.d/primemover
#
# Rotation is driven by the system logrotate.timer (runs daily). No extra cron
# entry is needed. Validate without applying:
#   logrotate -d /etc/logrotate.d/primemover
#
# IMPORTANT: copytruncate is mandatory here. The runner and the local Lambda
# server are started via `nohup ... > <log> 2>&1 &` (see scripts/full-startup.sh)
# and hold the file descriptor open for their whole lifetime. A rename/create
# rotation would leave them writing to the old (now-unlinked) inode and the new
# file would stay empty. copytruncate copies the file then truncates it in
# place, so the open fd keeps working.

# Runner stdout + stderr
/home/primemover/primemover_runner/primemover-runner/log/runner-stdout.log {
    daily
    rotate 7
    maxsize 1G
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su primemover primemover
}

# Local Lambda server stdout (orchestrator subprocess and full-startup.sh nohup)
/home/primemover/primemover-orchestrator/log/lambda-server.log {
    daily
    rotate 7
    maxsize 200M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su primemover primemover
}
