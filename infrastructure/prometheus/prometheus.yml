global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # Tempo metrics
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # PrimeMover API (if metrics endpoint available)
  # Uncomment and configure when API exposes Prometheus metrics
  # - job_name: 'primemover-api'
  #   static_configs:
  #     - targets: ['host.docker.internal:8090']
  #   metrics_path: /metrics

  # PrimeMover Runner (if metrics endpoint available)
  # Uncomment and configure when Runner exposes Prometheus metrics
  # - job_name: 'primemover-runner'
  #   static_configs:
  #     - targets: ['host.docker.internal:8081']
  #   metrics_path: /actuator/prometheus
