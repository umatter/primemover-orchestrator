name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Coverage is reported to the job log rather than uploaded anywhere. The
      # Codecov step that used to follow could not succeed -- this repo is
      # private, tokenless upload is public-repo-only, and no CODECOV_TOKEN
      # exists -- so every run ended in
      # `{"message":"Token required - not valid tokenless upload"}` and was
      # green only because fail_ci_if_error was false. A step that always fails
      # while reporting success is worse than no step.
      - name: Run tests
        run: pytest --cov=orchestrator --cov=pmspec --cov-report=term -v

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Check formatting with black
        run: black --check orchestrator/ pmspec/ scripts/

      - name: Lint with ruff
        run: ruff check orchestrator/ pmspec/ scripts/

      # The shell under scripts/ is load-bearing: it boots the stack, drains
      # HAR data and runs the boot health check. It was unchecked entirely
      # until 2026-08-21.
      - name: Lint shell scripts with shellcheck
        run: |
          shellcheck --version >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          }
          shellcheck -S warning scripts/*.sh

  type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type check with mypy
        run: mypy orchestrator/ pmspec/ scripts/ --ignore-missing-imports
