name: Compatibility Check

on:
  # Run weekly on Monday at 9am UTC
  schedule:
    - cron: '0 9 * * 1'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to look back'
        required: false
        default: '7'

jobs:
  check-compatibility:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for breaking changes
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          python scripts/check_compatibility.py --days "$DAYS" --token "$GITHUB_TOKEN" | tee output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Create issue if breaking changes found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('output.txt', 'utf8');

            // Check if there's already an open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'compatibility-check'
            });

            if (issues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `## Weekly Compatibility Check - ${new Date().toISOString().split('T')[0]}\n\n\`\`\`\n${output}\n\`\`\``
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Potentially Breaking Changes Detected in Integrated Repos',
                body: `The weekly compatibility check found changes that may break the orchestrator.\n\n\`\`\`\n${output}\n\`\`\`\n\n## Next Steps\n\n1. Review the [integration contract](docs/integration-contract.md)\n2. Check if the changes affect the orchestrator\n3. Update the orchestrator if needed\n4. Run tests: \`make test\``,
                labels: ['compatibility-check', 'needs-review']
              });
            }
