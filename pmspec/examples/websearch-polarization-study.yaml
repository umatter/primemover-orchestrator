# Web Search Personalization and Political Polarization Study
# Based on: examples/experiment designs/websearch_polarization.Rmd (July 2021)
#
# Key design elements, as this file stands:
# - 90 bots: political_type(3) × usage_type(3) × language(2) × privacy_setting(5),
#   1 replication. The study it is based on wanted N = 300 across three proxy
#   providers; those three provider pools are still declared below, but nothing
#   draws from them -- every bot here takes one Oxylabs exit IP from the runner's
#   own account (see the proxy block), and a from_pool draw would need one row per
#   bot per location.
# - Every bot is in US-IL-CHICAGO. The per-city pairing the design describes
#   (liberal and conservative bots with mirrored π in the same city) is not
#   expressed here: the crawler block used to write "{location}", a placeholder
#   nothing ever supplied, so it reached the bot as that literal string. A real
#   run makes location a factor or one crawler block per city.
# - Daily workflow: partisan visits, partisan searches, neutral visits, test searches
#
version: "1.0"

experiment:
  name: "Web Search Polarization Study 2025"
  description: |
    Investigating algorithmic personalization in web search results and its
    relationship to political polarization. Bots with different political
    orientations (π) browse partisan news sites, conduct partisan searches,
    and perform neutral test searches to measure personalization effects.

    Based on methodology from websearch_polarization.Rmd (July 2021).

# =============================================================================
# Default Configuration
# =============================================================================
defaults:
  browser: mlx
  timezone: America/Chicago
  timezone_utc_offset: "-06:00"
  captcha_mode: always
  typing_mode: SIMULATED_FIXINGTYPOS
  selection_type: XPATH
  active: true

# =============================================================================
# External Data Pools
# =============================================================================
data_pools:
  # Partisan news outlets with ideological scores
  outlets:
    type: csv
    source: "data/outlets_pool.csv"
    description: |
      News outlets with columns: domain, url, pi (ideology score -1 to +1),
      reach, USshare, local (boolean), states_served

  # Neutral domains for non-partisan browsing
  neutral_domains:
    type: csv
    source: "data/neutraldomains_pool.csv"
    description: "Most visited neutral websites (non-news)"

  # Partisan search terms with ideology scores
  search_terms:
    type: csv
    source: "data/searchterms_pool.csv"
    description: |
      Search terms with columns: term, pi (ideology score)
      Used to build each bot's vocabulary L based on distance to bot's π

  # Neutral/test search terms (updated weekly from GDELT + Google Trends).
  # The running study refreshes this file from S3 each week; a spec resolves
  # its pools from disk, so the copy this example reads is a local one.
  neutral_search_terms:
    type: json
    source: "data/neutralsearchterms_pool.json"
    description: |
      Neutral search terms, from GDELT (trending persons/orgs) and Google
      Trends, refreshed weekly; all bots use the same 3 terms/day. The study
      uses 21; the sample file here holds 6.

  # Proxy configurations per provider
  proxies_geosurf:
    type: csv
    source: "data/proxies_geosurf.csv"
    description: "Geosurf rotating residential proxies (30-min sticky)"

  proxies_rotating:
    type: csv
    source: "data/proxies_rotating.csv"
    description: "RotatingProxies private residential (monthly rotation)"

  proxies_private:
    type: csv
    source: "data/proxies_private.csv"
    description: "PrivateProxies private residential (monthly rotation)"

# =============================================================================
# Reusable Workflow Templates
# =============================================================================
templates:
  # Initial browserleaks fingerprint collection (day 1 only)
  browserleaks_check:
    - visit: https://browserleaks.com/
    - wait: 5s
    - visit: https://browserleaks.com/javascript
    - wait: 3s
    - visit: https://browserleaks.com/canvas
    - wait: 3s
    - visit: https://browserleaks.com/webgl
    - wait: 3s
    - visit: https://browserleaks.com/fonts
    - wait: 3s

  # Visit a partisan news outlet (selected by Lambda based on u_ijt)
  partisan_outlet_visit:
    - lambda_select:
        task: select_partisan_outlet
        function: bot-decision-websearch
        link_type: FUNCTION_NAME
        # Select outlet based on u_ijt = α - τ*d² + ε
    - wait: {min: 30, max: 90}
    - scroll: 30s

  # Conduct partisan search (term selected by Lambda based on v_ikt)
  partisan_search:
    - visit: https://google.com
    - wait: 3s
    - lambda_select:
        task: select_search_term
        function: bot-decision-websearch
        link_type: FUNCTION_NAME
        # Select term based on v_ikt = α - τ*d² + ε
    - wait: 5s
    # Select from SERP based on w_ijt
    - lambda_select:
        task: select_from_serp
        function: bot-decision-websearch
        link_type: FUNCTION_NAME
        # Select result based on w_ijt = [1-β(r-1)] + I(j∈K)*(α - τ*d²) + ε
    - wait: 20s
    - scroll: 20s

  # Neutral domain visit
  neutral_visit:
    - lambda_select:
        task: select_neutral_domain
        function: bot-decision-websearch
        link_type: FUNCTION_NAME
        # Random selection from neutraldomains_pool
    - wait: {min: 20, max: 60}
    - scroll: 20s

  # Test/neutral search (same terms for all bots)
  test_search:
    - visit: https://google.com
    - wait: 3s
    - lambda_select:
        task: get_daily_test_term
        function: bot-decision-websearch
        link_type: FUNCTION_NAME
        # Get one of 3 daily neutral search terms
    - wait: 5s
    - lambda_select:
        task: select_from_serp_neutral
        function: bot-decision-websearch
        link_type: FUNCTION_NAME
        # Select from SERP (record for analysis)
    - wait: 15s

# =============================================================================
# Factorial Design
# =============================================================================
design:
  type: factorial
  seed: 2025

  factors:
    # Political orientation type (determines π assignment)
    political_type:
      levels:
        - id: liberal
          proportion: 0.333
        - id: conservative
          proportion: 0.333
        - id: neutral
          proportion: 0.334
      maps_to:
        # Note: actual π values computed at runtime based on city pairing
        configuration.preferences.political_type:
          liberal: "liberal"
          conservative: "conservative"
          neutral: "neutral"

    # Web usage behavior type
    usage_type:
      levels:
        - id: only_searches
          proportion: 0.25
        - id: only_visits
          proportion: 0.25
        - id: searches_and_visits
          proportion: 0.50
      maps_to:
        configuration.preferences.usage_type:
          only_searches: "only_searches"
          only_visits: "only_visits"
          searches_and_visits: "searches_and_visits"

    # Browser language setting
    language:
      levels:
        - id: english
          proportion: 0.75
        - id: spanish
          proportion: 0.25
      maps_to:
        configuration.preferences.browser_language:
          english: "en-US,en;q=0.5"
          spanish: "es-MX,es;q=0.8,en-US;q=0.5,en;q=0.3"

    # Privacy setting (5 groups: 4 with one setting each, 1 with none)
    privacy_setting:
      levels:
        - id: none
          proportion: 0.20
        - id: block_geolocation
          proportion: 0.20
        - id: do_not_track
          proportion: 0.20
        - id: block_canvas
          proportion: 0.20
        - id: disable_storage
          proportion: 0.20
      maps_to:
        configuration.preferences.privacy_block_geolocation:
          none: "false"
          block_geolocation: "true"
          do_not_track: "false"
          block_canvas: "false"
          disable_storage: "false"
        configuration.preferences.privacy_do_not_track:
          none: "false"
          block_geolocation: "false"
          do_not_track: "true"
          block_canvas: "false"
          disable_storage: "false"
        configuration.preferences.privacy_block_canvas:
          none: "false"
          block_geolocation: "false"
          do_not_track: "false"
          block_canvas: "true"
          disable_storage: "false"
        configuration.preferences.privacy_disable_storage:
          none: "false"
          block_geolocation: "false"
          do_not_track: "false"
          block_canvas: "false"
          disable_storage: "true"

  # Parameter distributions (applied to each crawler)
  #
  # The model's Greek letters are NOT the pipeline's params of the same name.
  # `pi`, `psi`, `kappa` and `tau` in configuration.params are 0/1 switches the
  # decision function reads as int(round(x)) == 1; this study's π is a
  # continuous ideology score, its κ a three-way updating rule, and neither
  # survives that rounding. So they are sampled under their own names and
  # recorded on the bot as preferences (see the crawler block below), which is
  # also what makes them visible to the analysis. Only alpha and beta -- real
  # params the pipeline carries, and not switches -- are injected into
  # configuration.params by their standard names.
  parameters:
    # Political orientation: uniform(-1, 1)
    # Note: for liberal/conservative pairs, values are mirrored per city
    pi_score:
      distribution: uniform
      min: -1.0
      max: 1.0

    # Preference strength for ideologically close content
    alpha:
      distribution: uniform
      min: 0.2
      max: 0.5

    # Distance penalty (fixed)
    tau_penalty:
      value: 1.0

    # Rank decay in SERP selection
    beta:
      distribution: uniform
      min: 0.0
      max: 0.5

    # Additional parameter (exploration tendency)
    psi_explore:
      distribution: uniform
      min: 0.0
      max: 0.2

    # Information processing type
    kappa_update:
      distribution: discrete
      values:
        0: 0.25   # No updating
        1: 0.25   # Always update
        2: 0.50   # Update only from unknown sources

    # Stochastic error term (Gumbel distributed)
    # Used in utility calculations: ε ~ Gumbel(μ=-0.4557735, β=0.0793006)
    epsilon_mu:
      value: -0.4557735

    epsilon_beta:
      value: 0.0793006

  # Target: 300 bots total across all factor combinations
  # The actual number depends on proportions and constraints
  replications: 1

# =============================================================================
# Crawler Definition
# =============================================================================
crawlers:
  - from_design: true
    name: "ws_{political_type}_{usage_type}_{language}_{privacy_setting}_{replica:03d}"
    description: "Web search polarization bot"
    active: true
    testing: false

    configuration:
      name: "Config {political_type}"
      params:
        # alpha and beta are sampled per crawler and injected here under their
        # standard names; nothing else in design.parameters is a param the
        # pipeline carries, so nothing else belongs in this block. A key the
        # API does not define a column for is dropped on the way to the bot.
        active: true
      preferences:
        # Everything the pipeline will not carry as a param, recorded where it
        # does reach the bot and the analysis: the model's own parameters, and
        # the two design constants.
        - name: pi_score
          value: "{pi_score:.4f}"
        - name: tau_penalty
          value: "{tau_penalty}"
        - name: psi_explore
          value: "{psi_explore:.4f}"
        - name: kappa_update
          value: "{kappa_update}"
        - name: epsilon_mu
          value: "{epsilon_mu:.7f}"
        - name: epsilon_beta
          value: "{epsilon_beta:.7f}"
        - name: known_outlets_count      # |K| = 10
          value: "10"
        - name: search_terms_count       # |L| = 40
          value: "40"
        - name: location
          value: "US-IL-CHICAGO"
        - name: usage_type
          value: "{usage_type}"
        - name: political_type
          value: "{political_type}"
        - name: browser_language
          value: "{browser_language}"
        - name: privacy_block_geolocation
          value: "{privacy_block_geolocation}"
        - name: privacy_do_not_track
          value: "{privacy_do_not_track}"
        - name: privacy_block_canvas
          value: "{privacy_block_canvas}"
        - name: privacy_disable_storage
          value: "{privacy_disable_storage}"

    # One exit IP per bot, from the runner's own Oxylabs account: `oxylabs` is
    # self-configuring (the runner supplies endpoint and credentials, and
    # geo-targeting follows the agent's location), so no credentials belong in
    # a spec file.
    #
    # The three provider pools declared above are what the running study draws
    # from instead -- `proxy: {from_pool: true, pool: proxies_geosurf,
    # match_field: location}`. That form hands out one row per bot without
    # replacement, so the pool must hold at least one row per bot for that
    # bot's location; the sample files here hold three rows each, which is why
    # this example does not use them.
    proxy:
      type: oxylabs
      location: "US-IL-CHICAGO"
      active: true

    agent:
      name: "Agent {political_type} {replica:03d}"
      identification: mlx
      location: "US-IL-CHICAGO"

    # Daily browsing session (10am - 5pm local time)
    session:
      name: "Daily Session"
      start: "2025-03-01T10:00:00"
      timezone: "America/Chicago"
      timezone_utc_offset: "-06:00"

      # A template/repeat item carries only template/repeat/with/jobs; there is
      # no `condition:` key (an earlier version of this example wrote one, and it
      # was silently ignored -- every bot ran every step). Gate steps on a
      # factor by giving each usage_type arm its own crawler block instead.
      workflow:
        # Day 1: Browserleaks fingerprint check
        - template: browserleaks_check

        # Partisan outlet visits (2 per day)
        - repeat: 2
          template: partisan_outlet_visit

        # Neutral domain visits (2 per day)
        - repeat: 2
          template: neutral_visit

        # Partisan searches (2 per day)
        - repeat: 2
          template: partisan_search

        # Test searches (2 of 3 daily terms, immediately after main session)
        - repeat: 2
          template: test_search

    # Second session: Final test search (synchronized across all bots)
    additional_sessions:
      - name: "Synchronized Test Search"
        start: "2025-03-01T18:00:00"  # ~1 hour after last bot finishes
        timezone: "America/Chicago"
        workflow:
          # Third daily test search (synchronized)
          - template: test_search

# =============================================================================
# Notes on Implementation
# =============================================================================
#
# RUNTIME REQUIREMENTS:
# 1. Lambda function 'bot-decision-websearch' must implement:
#    - select_partisan_outlet: u_ijt = α - τ*d² + ε (probabilistic choice)
#    - select_search_term: v_ikt = α - τ*d² + ε (probabilistic choice)
#    - select_from_serp: w_ijt = [1-β(r-1)] + I(j∈K)*(α - τ*d²) + ε
#    - select_neutral_domain: random from pool
#    - get_daily_test_term: return one of 3 daily terms
#
# 2. Daily updating procedure (during bot rest period):
#    - Extract π_j values from neutral search SERP selections
#    - Update π_i based on κ:
#      * κ=0: No update
#      * κ=1: π_it = (1-φ)*π_{it-1} + φ*π_j
#      * κ=2: Same as κ=1, but only if j ∉ K_i
#    - Update K_i (known outlets) by re-ranking with new scores
#    - Update L_i (search terms) by recomputing v_ikt with new π_i
#
# 3. City pairing for political_type:
#    - liberal bots: π assigned from uniform(-1, 0)
#    - conservative bots in same city: π = -π_liberal (mirrored)
#    - neutral bots: no π-driven behavior
#
# 4. Data files. Every pool this spec declares now resolves against a small
#    sample file in data/, so the example validates and compiles as it stands.
#    They are illustrative, not the study's data: the real run supplies its own
#    outlets, search terms, neutral domains (and refreshes
#    neutralsearchterms_pool.json weekly from S3), and one proxy row per bot
#    per location in each provider pool.
#
# 5. The model's parameters (π, τ, ψ, κ, ε) are sampled under their own names
#    and recorded as preferences, because configuration.params.pi/psi/kappa/tau
#    are 0/1 switches the decision function reads as int(round(x)) == 1 -- see
#    the note on design.parameters above.
