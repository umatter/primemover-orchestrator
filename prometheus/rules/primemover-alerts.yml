groups:
  - name: primemover-api
    rules:
      - alert: PrimeMoverAPIHighErrorRate
        expr: |
          sum(rate(loki_logs_total{component="api",level="error"}[5m]))
          / sum(rate(loki_logs_total{component="api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "PrimeMover API error rate is high"
          description: "API error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      - alert: PrimeMoverAPIDown
        expr: up{job="primemover-api"} == 0
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "PrimeMover API is down"
          description: "PrimeMover API has been unreachable for more than 2 minutes"

  - name: primemover-runner
    rules:
      - alert: PrimeMoverRunnerHighErrorRate
        expr: |
          sum(rate(loki_logs_total{component="runner",level="error"}[5m]))
          / sum(rate(loki_logs_total{component="runner"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          component: runner
        annotations:
          summary: "PrimeMover Runner error rate is high"
          description: "Runner error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      - alert: PrimeMoverRunnerJobFailed
        expr: |
          increase(loki_logs_total{component="runner",level="error",message=~".*job.*failed.*"}[15m]) > 5
        for: 1m
        labels:
          severity: warning
          component: runner
        annotations:
          summary: "Multiple job failures detected"
          description: "{{ $value }} jobs have failed in the last 15 minutes"

      - alert: PrimeMoverRunnerNoActivity
        expr: |
          sum(increase(loki_logs_total{component="runner"}[30m])) == 0
        for: 30m
        labels:
          severity: warning
          component: runner
        annotations:
          summary: "No Runner activity detected"
          description: "No runner logs have been received for 30 minutes"

  - name: primemover-lambda
    rules:
      - alert: LambdaHighErrorRate
        expr: |
          sum(rate(aws_lambda_errors_total{function_name="bot-decision-yt"}[5m]))
          / sum(rate(aws_lambda_invocations_total{function_name="bot-decision-yt"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          component: lambda
        annotations:
          summary: "Lambda function error rate is high"
          description: "bot-decision-yt error rate is {{ $value | humanizePercentage }}"

      - alert: LambdaHighDuration
        expr: |
          aws_lambda_duration_average{function_name="bot-decision-yt"} > 10000
        for: 5m
        labels:
          severity: warning
          component: lambda
        annotations:
          summary: "Lambda function duration is high"
          description: "Average duration is {{ $value }}ms (threshold: 10000ms)"

      - alert: LambdaHighMemoryUtilization
        expr: |
          (aws_lambda_max_memory_used{function_name="bot-decision-yt"}
          / aws_lambda_memory_size{function_name="bot-decision-yt"}) * 100 > 80
        for: 10m
        labels:
          severity: warning
          component: lambda
        annotations:
          summary: "Lambda memory utilization is high"
          description: "Memory utilization is {{ $value | humanize }}%"

      - alert: LambdaThrottling
        expr: |
          sum(increase(aws_lambda_throttles_total{function_name="bot-decision-yt"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
          component: lambda
        annotations:
          summary: "Lambda function is being throttled"
          description: "{{ $value }} throttles in the last 5 minutes"

  - name: primemover-infrastructure
    rules:
      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 2m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Loki is down"
          description: "Loki log aggregation service has been unreachable for more than 2 minutes"

      - alert: GrafanaDown
        expr: up{job="grafana"} == 0
        for: 2m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Grafana is down"
          description: "Grafana dashboard service has been unreachable for more than 2 minutes"

      - alert: HighLogVolume
        expr: |
          sum(rate(loki_logs_total[5m])) > 1000
        for: 10m
        labels:
          severity: info
          component: infrastructure
        annotations:
          summary: "High log volume detected"
          description: "Log ingestion rate is {{ $value | humanize }} logs/second"

  - name: primemover-experiments
    rules:
      - alert: ExperimentHighFailureRate
        expr: |
          sum(increase(loki_logs_total{level="error"}[1h])) by (experiment_id)
          / sum(increase(loki_logs_total[1h])) by (experiment_id) > 0.1
        for: 30m
        labels:
          severity: warning
          component: experiment
        annotations:
          summary: "Experiment {{ $labels.experiment_id }} has high failure rate"
          description: "Error rate is {{ $value | humanizePercentage }} over the last hour"

      - alert: CrawlerStalled
        expr: |
          time() - max(loki_logs_timestamp{component="runner"}) by (crawler_id) > 3600
        for: 5m
        labels:
          severity: warning
          component: crawler
        annotations:
          summary: "Crawler {{ $labels.crawler_id }} appears stalled"
          description: "No logs from crawler for over 1 hour"
